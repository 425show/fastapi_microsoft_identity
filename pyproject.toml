[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi_microsoft_identity"
dynamic = ["version"]
description = "Azure AD authentication for Fast API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christos Matskas", email = "christos.matskas@microsoft.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.10.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/cmatskas/fastapi_microsoft_identity"

[tool.setuptools]
packages = ["fastapi_microsoft_identity"]

[tool.setuptools.dynamic]
version = { attr = "fastapi_microsoft_identity.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
