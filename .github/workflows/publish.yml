# Publishes to PyPI when a version tag (e.g. v0.2.0) is pushed.
# Uses PyPI trusted publishing: configure it once at
# https://pypi.org/manage/project/fastapi-microsoft-identity/settings/publishing/
# (owner: cmatskas, repo: fastapi_microsoft_identity, workflow: publish.yml, environment: pypi)
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
